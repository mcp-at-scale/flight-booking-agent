[project]
name = "pyflight-internal"
version = "0.1.0"
description = "Internal flight data library: airlines, airports, flights, and search"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflight_internal"]
