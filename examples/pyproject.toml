[project]
name = "chapter2"
version = "0.1.0"
description = "Flight booking system simulation with JSON-based data and Pydantic models"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.4",
    # MCP Python SDK v2 (beta). mcp-types tracks the SDK version exactly.
    # TODO: re-pin to the v2 GA release before the book ships.
    "mcp[cli]==2.0.0b1",
    "mcp-types==2.0.0b1",
    "pyflight-internal",
    "PyJWT[crypto]>=2.8.0",
    # OpenTelemetry stack for the §5.4 production-tracing example.
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
]

[tool.uv.sources]
pyflight-internal = { path = "../pyflight-internal" }

[project.scripts]
flight-booking-mcp = "chapter2.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chapter2"]
