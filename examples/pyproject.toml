[project]
name = "chapter2"
version = "0.1.0"
description = "Flight booking system simulation with JSON-based data and Pydantic models"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.4",
    "mcp[cli] @ git+https://github.com/modelcontextprotocol/python-sdk.git",
    "pyflight-internal",
    "PyJWT[crypto]>=2.8.0",
]

[tool.uv.sources]
pyflight-internal = { path = "../pyflight-internal" }

[project.scripts]
flight-booking-mcp = "chapter2.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chapter2"]
